<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>補藥神器</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補藥神器">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151C" media="(prefers-color-scheme: dark)">
<style>
  html,body{margin:0;height:100%;background:#EEF2F6}
  @media (prefers-color-scheme:dark){ html,body{background:#0E151C} }
  iframe{border:0;width:100%;height:100%;height:100dvh;display:block}
  .msg{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#3F5566;padding:32px 22px;line-height:1.8;font-size:16px}
  @media (prefers-color-scheme:dark){ .msg{color:#B0C0CE} }
</style>
</head>
<body>
<script>
/* 補藥神器外殼（v5）：清單校對（?lst=）也走這裡；錄音轉 16kHz WAV 再送。
   1. 把 Apps Script 的網頁用 iframe 包進來，Google 那條「這個應用程式是由 Google Apps Script 的使用者建立」就不會出現。
   2. 幫裡面的網頁錄音（裡面那一層包在 Google 的框框裡拿不到麥克風，最外層這一頁拿得到）：
      裡面按 🎤 → 這裡錄最長 6 秒 → 把錄音丟回去 → 裡面送給後端聽寫（跟 LINE 語音同一套）。
   網址長這樣：外殼/?x=部署ID&app=鑰匙（藥師版）或 &dev=鑰匙（開發者版）。鑰匙由 LINE 給，這個檔案裡沒有任何秘密。 */
(function(){
  var q = new URLSearchParams(location.search);
  var x = q.get("x") || "", app = q.get("app") || "", dev = q.get("dev") || "", lst = q.get("lst") || "";
  var kind = lst ? "lst" : dev ? "dev" : "app", tok = lst || dev || app;
  var okTok = kind === "lst" ? /^[0-9a-f]{16}$/.test(tok) : /^[0-9a-f]{32}$/.test(tok);
  if (!/^[A-Za-z0-9_-]{20,}$/.test(x) || !okTok) {
    document.body.innerHTML = '<p class="msg">這條連結不完整。<br>回 LINE 按下面那排的「🌐 補藥神器網頁」再開一次。</p>';
    return;
  }
  if (kind === "lst") document.title = "清單校對";
  var f = document.createElement("iframe");
  /* #up／#rv 這種頁內位置（清單校對用）一起帶進去 */
  f.src = "https://script.google.com/macros/s/" + x + "/exec?" + kind + "=" + tok + (location.hash || "");
  f.allow = "camera; microphone";
  f.setAttribute("allowfullscreen", "");
  f.title = "補藥神器";
  document.body.appendChild(f);

  /* ── 錄音 ── */
  /* 裡面那一頁其實在 Google 的框框裡（我們的 iframe → Google 的頁 → 補藥神器），所以訊息的來源是「孫」不是「子」：
     記住第一次打招呼的那個視窗，之後都回給它。 */
  var canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  var MAX_MS = 6000, rec = null, stream = null, chunks = [], timer = null, inner = null;
  function post(m){ try { if (inner) inner.postMessage(Object.assign({ buyao: 1 }, m), "*"); } catch (e) {} }
  function fromInside(ev){
    if (!ev.data || ev.data.buyao !== 1 || ev.source === window) return false;
    var o = String(ev.origin || "");
    return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(o);
  }
  function pickMime(){
    var list = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
    for (var i = 0; i < list.length; i++) { try { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) {} }
    return "";
  }
  function stopAll(){
    if (timer) { clearTimeout(timer); timer = null; }
    try { if (rec && rec.state !== "inactive") rec.stop(); } catch (e) {}
  }
  function release(){ try { if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {} stream = null; rec = null; }
  /* 錄音轉成 16kHz 單聲道 WAV：手機錄出來的 webm／m4a 格式各家不同，聽寫（Groq／Deepgram／Gemini）拿 wav 最穩。
     用 OfflineAudioContext 解碼不需要使用者手勢；解不開就回 null，照送原檔。 */
  function toWav(blob, cb){
    var AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC || !blob.arrayBuffer) { cb(null); return; }
    var done = false; function fin(v){ if (!done) { done = true; cb(v); } }
    setTimeout(function(){ fin(null); }, 4000);
    blob.arrayBuffer().then(function(buf){
      var probe = new AC(1, 16000, 16000);
      var p = probe.decodeAudioData(buf, function(audio){ fin(encode(audio)); }, function(){ fin(null); });
      if (p && p.then) p.then(function(audio){ fin(encode(audio)); }).catch(function(){ fin(null); });
    }).catch(function(){ fin(null); });
    function encode(audio){
      try {
        var sr = audio.sampleRate, n = audio.length, ch = audio.numberOfChannels, mono = new Float32Array(n);
        for (var c = 0; c < ch; c++) { var d = audio.getChannelData(c); for (var i = 0; i < n; i++) mono[i] += d[i] / ch; }
        var target = 16000, ratio = sr / target, len = Math.floor(n / ratio), pcm = new Int16Array(len);
        for (var j = 0; j < len; j++) {
          var s0 = Math.floor(j * ratio), s1 = Math.min(n, Math.floor((j + 1) * ratio)), sum = 0, cnt = 0;
          for (var k = s0; k < s1; k++) { sum += mono[k]; cnt++; }
          var v = cnt ? sum / cnt : 0; v = Math.max(-1, Math.min(1, v));
          pcm[j] = v < 0 ? v * 32768 : v * 32767;
        }
        var wav = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(wav);
        function str(o, s){ for (var i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); }
        str(0, "RIFF"); dv.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
        dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, target, true);
        dv.setUint32(28, target * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); str(36, "data"); dv.setUint32(40, pcm.length * 2, true);
        new Int16Array(wav, 44).set(pcm);
        return new Blob([wav], { type: "audio/wav" });
      } catch (e) { return null; }
    }
  }
  function start(){
    if (rec && rec.state === "recording") return;
    chunks = [];
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(s){
      stream = s;
      var mime = pickMime();
      try { rec = mime ? new MediaRecorder(s, { mimeType: mime }) : new MediaRecorder(s); }
      catch (e) { release(); post({ t: "rec-error", why: "recorder" }); return; }
      rec.ondataavailable = function(ev){ if (ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = function(){
        var type = rec && rec.mimeType || mime || "audio/mp4";
        var blob = new Blob(chunks, { type: type });
        release();
        if (!blob.size) { post({ t: "audio", b64: "", mime: type, kb: 0 }); return; }
        toWav(blob, function(wav){
          var out = wav || blob, om = wav ? "audio/wav" : type.split(";")[0];
          var r = new FileReader();
          r.onload = function(){ var u = String(r.result); post({ t: "audio", b64: u.substring(u.indexOf(",") + 1), mime: om, kb: Math.round(out.size / 1024) }); };
          r.onerror = function(){ post({ t: "rec-error", why: "read" }); };
          r.readAsDataURL(out);
        });
      };
      rec.onerror = function(){ release(); post({ t: "rec-error", why: "recorder" }); };
      rec.start();
      post({ t: "rec-on" });
      timer = setTimeout(stopAll, MAX_MS);
    }).catch(function(err){
      var why = err && (err.name === "NotAllowedError" || err.name === "SecurityError") ? "denied" : (err && err.name || "mic");
      post({ t: "rec-error", why: why });
    });
  }
  window.addEventListener("message", function(ev){
    if (!fromInside(ev)) return;
    var m = ev.data;
    if (m.t === "hello") { inner = ev.source; post({ t: "ready", mic: canMic }); return; }
    if (!inner || ev.source !== inner) return;
    if (m.t === "rec-start") { if (canMic) start(); else post({ t: "rec-error", why: "nomic" }); return; }
    if (m.t === "rec-stop") { stopAll(); return; }
  });
})();
</script>
</body>
</html>
