<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src https://script.google.com https://script.googleusercontent.com; media-src 'self' blob: data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="buyao-v" content="v11.22.2">
<title>補藥神器</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補藥神器">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151C" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --ground:#EEF2F6; --surface:#FFFFFF; --sunk:#E3EAF1; --line:#D1DBE5;
    --ink:#14202B; --ink2:#3F5566; --muted:#7A8C9A;
    --accent:#1F6FD0; --accent-soft:#E4EEFA; --accent-ink:#FFFFFF;
    --leaf:#1B7F5C; --leaf-soft:#E3F1EA;
    --warn:#B26A00; --warn-soft:#FFF4DE;
    --danger:#B0392B; --danger-soft:#FDE9E6;
    --pin:#E8514B;
    --shadow:0 1px 2px rgba(20,32,43,.06), 0 8px 22px rgba(20,32,43,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E151C; --surface:#16212B; --sunk:#1D2A36; --line:#2A3947;
      --ink:#E3EAF0; --ink2:#B0C0CE; --muted:#85979F;
      --accent:#7FB4E8; --accent-soft:#143050; --accent-ink:#0E151C;
      --leaf:#5FC49E; --leaf-soft:#16392C;
      --warn:#EBB05C; --warn-soft:#37290F;
      --danger:#E8897C; --danger-soft:#3A1F1B;
      --pin:#F0726C; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E151C; --surface:#16212B; --sunk:#1D2A36; --line:#2A3947;
    --ink:#E3EAF0; --ink2:#B0C0CE; --muted:#85979F;
    --accent:#7FB4E8; --accent-soft:#143050; --accent-ink:#0E151C;
    --leaf:#5FC49E; --leaf-soft:#16392C;
    --warn:#EBB05C; --warn-soft:#37290F;
    --danger:#E8897C; --danger-soft:#3A1F1B;
    --pin:#F0726C; --shadow:none;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0; background:var(--ground); color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:15.5px; line-height:1.6; padding-inline:0}
  button,input{font-family:inherit; font-size:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}

  /* ── 上方固定：標題＋搜尋 ── */
  .top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ground);
    padding:8px 14px 10px; border-bottom:1px solid var(--line)}
  .topin{max-width:640px; margin:0 auto}
  .hb{display:flex; align-items:center; gap:9px; border:0; background:transparent; color:var(--ink); padding:0 0 7px; margin:0}
  .hb img{width:40px; height:40px; flex:0 0 40px}
  .hb b{font-size:18px; letter-spacing:.01em}
  .search{display:flex; gap:7px; align-items:stretch}
  .search input{flex:1; min-width:0; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:12px; padding:11px 14px; font-size:16px; line-height:1.3}
  .search input::placeholder{color:var(--muted); font-size:14px}
  @media (max-width:480px){ .search input::placeholder{font-size:13px} }
  .search button{flex:0 0 46px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:12px; font-size:19px; line-height:1; padding:0}
  .search button.on{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
  .hint{font-size:12.5px; color:var(--muted); padding:7px 2px 0; min-height:26px; line-height:1.5}
  .hint span{display:inline-block; white-space:nowrap; margin-right:9px}
  .hint.bad{color:var(--danger)}
  .hint.busy::before{content:""; display:inline-block; width:10px; height:10px; border:2px solid var(--accent);
    border-right-color:transparent; border-radius:50%; margin-right:7px; vertical-align:-1px; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .hint.busy::before{animation:none} }

  /* ── 內容 ── */
  main{max-width:640px; margin:0 auto; padding:12px 14px calc(40px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:14px}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:26px 10px 20px; line-height:1.8}
  .empty b{color:var(--ink2); display:block; font-size:15.5px; margin-bottom:4px}
  /* v11.20.1：開發者綁定碼 */
  .bindf{display:flex; gap:8px; justify-content:center; margin:16px 0 8px}
  .bindf input{width:9.5em; min-width:0; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px;
    padding:10px 12px; font-size:22px; letter-spacing:.3em; text-align:center; font-variant-numeric:tabular-nums}
  .bindf button{border:0; border-radius:12px; padding:0 20px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:16px}
  .bindf button:disabled{opacity:.6}
  .bindm{display:block; min-height:1.7em; color:var(--danger); font-size:14px}
  .bindbox small{display:block; color:var(--muted); font-size:12.5px}

  /* 首頁區塊 */
  .sec{display:flex; flex-direction:column; gap:8px}
  .sh{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:0 3px}
  .sh b{font-size:15.5px; color:var(--ink2)}
  .sh span{font-size:12.5px; color:var(--muted)}
  .tabs{display:flex; gap:4px; background:var(--sunk); padding:4px; border-radius:12px}
  .tabs button{flex:1; border:0; background:transparent; color:var(--muted); border-radius:9px; padding:5px 8px;
    font-size:14.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px}
  .tabs img{width:28px; height:28px}
  .tabs button[aria-selected="true"]{background:var(--surface); color:var(--accent); box-shadow:var(--shadow)}
  .tabs button small{font-weight:500; margin-left:4px; font-size:12px}
  .sortrow{display:flex; gap:4px; align-items:center; justify-content:flex-end; font-size:12.5px; color:var(--muted); padding:0 3px}
  .sortrow button{border:0; background:transparent; color:var(--muted); padding:2px 8px; font-size:12.5px; border-radius:7px}
  .sortrow button[aria-pressed="true"]{color:var(--accent); font-weight:700; background:var(--accent-soft)}

  /* 清單 */
  .list{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
  .list .h{padding:10px 15px; font-size:12.5px; color:var(--muted); background:var(--sunk); border-bottom:1px solid var(--line)}
  .list .g{padding:6px 15px; font-size:12px; font-weight:700; color:var(--warn); background:var(--warn-soft); border-bottom:1px solid var(--line)}
  .list .none{padding:16px 15px; font-size:13.5px; color:var(--muted)}
  .list .kg{display:flex; align-items:center; gap:7px; padding:10px 14px 7px; font-size:15px; font-weight:700; color:var(--accent); background:var(--surface); border-bottom:1px solid var(--line)}
  .list .kg img{width:26px; height:26px}
  .list .kg b{margin-left:6px}
  .samebox{margin-top:2px}
  .list .kg.same{color:#5B3FA0; background:#F3EFFB; font-size:15px; padding:9px 14px 7px}
  .list .sub{font-size:12.5px; font-weight:700; color:#7A5FC0; background:#F8F5FD; padding:6px 14px 4px; border-bottom:1px solid var(--line)}
  .list .sub b{margin-left:6px; font-weight:500}
  :root[data-theme="dark"] .list .kg.same{color:#C9B8F2; background:#2A2340}
  :root[data-theme="dark"] .list .sub{color:#B8A6E6; background:#231D33}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .list .kg.same{color:#C9B8F2; background:#2A2340} :root:not([data-theme="light"]) .list .sub{color:#B8A6E6; background:#231D33} }
  .row .n i.fl{color:var(--muted); font-size:12px}
  .tabs.wrap{flex-wrap:wrap}
  .tabs.wrap button{flex:1 1 30%; min-width:30%; padding:7px 6px; font-size:13.5px; gap:5px; white-space:nowrap}
  .tabs.wrap button[aria-selected="true"]{color:var(--warn)}
  /* 每一列＝LINE 公告卡的排法：小照片｜藥名／中文／（公告補充）／劑型＋CODE｜位置 */
  .row{display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center; padding:9px 12px 9px 10px;
    border-bottom:1px solid var(--line); background:transparent; border-left:0; border-right:0; border-top:0;
    width:100%; text-align:left; color:var(--ink)}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--sunk)}
  .row .ph{position:relative; width:50px; height:50px; border-radius:8px; overflow:hidden; background:var(--sunk); border:1px solid var(--line); flex:0 0 50px}
  .row .ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .row .ph .ki{object-fit:contain; padding:8px; opacity:.45}
  .row .ph .pi{background:#fff}
  .row .n{display:flex; flex-direction:column; min-width:0; gap:1px}
  .row .n b{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .n .z{font-size:13.5px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .n i{font-style:normal; font-size:12.5px; color:var(--warn); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .n .k{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); line-height:1.2; white-space:nowrap}
  .row .n .k img{width:18px; height:18px; object-fit:contain}
  .row .n .k .c{font-size:12.5px; font-weight:600; color:var(--muted); margin-left:7px}
  .row .l{font-size:14.5px; font-weight:700; color:var(--pin); white-space:nowrap}

  /* 藥品卡片 */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px}
  .card .head{display:flex; gap:12px; align-items:flex-start}
  .card .head .t{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
  .card .code{font-size:34px; font-weight:700; line-height:1.05; color:var(--ink2); letter-spacing:-.01em}
  .card .qty{font-size:16px; font-weight:700; color:var(--warn); background:var(--warn-soft); border-radius:8px; padding:2px 8px; vertical-align:middle}
  .kv a{color:var(--accent); text-decoration:none; font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:10px 15px; border-bottom:1px solid var(--line); background:var(--sunk)}
  .chips span{font-size:12.5px; padding:3px 9px; border-radius:8px; background:var(--surface); color:var(--ink2); border:1px solid var(--line)}
  .chips span.ok{color:var(--leaf); border-color:var(--leaf-soft); background:var(--leaf-soft)}
  .chips span.no{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft)}
  .card .brand{font-size:20px; font-weight:700; line-height:1.25; overflow-wrap:anywhere}
  .card .zh{font-size:17px; font-weight:700; color:var(--accent); line-height:1.3}
  .card .gen{font-size:12.5px; color:var(--muted); line-height:1.5; white-space:pre-line; margin-top:3px}
  .card .side{flex:0 0 88px; display:flex; flex-direction:column; align-items:center; gap:4px}
  .card .icon{width:88px; height:88px; border-radius:18px; background:var(--sunk);
    display:flex; align-items:center; justify-content:center; text-decoration:none}
  .card .icon img{width:80px; height:80px}
  .card .ref{font-size:10.5px; color:var(--muted); line-height:1.2}
  /* 手機：字縮小、圖縮小，位置（在最後）才進得了第一個畫面 */
  @media (max-width:480px){
    .card{padding:14px 14px 12px; gap:10px}
    .card .code{font-size:26px}
    .card .brand{font-size:16.5px}
    .card .zh{font-size:14.5px}
    .card .gen{font-size:11.5px}
    .card .side{flex:0 0 68px}
    .card .icon{width:68px; height:68px; border-radius:14px}
    .card .icon img{width:60px; height:60px}
    .box{padding:8px 11px}
    .box .v{font-size:14px}
    .kv .v{font-size:14px}
    .loc{padding:9px 13px; min-width:92px}
    .loc .t{font-size:21px}
    .loc.long .t{font-size:16px}
    .loc .pin{font-size:19px}
    .photo{max-width:100%; aspect-ratio:16/9}
  }
  /*DEV*/.devtag{font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:middle}/*/DEV*/
  /*DEV*/
  .actions button.edit{background:var(--leaf-soft); border-color:var(--leaf-soft); color:var(--leaf)}
  /*/DEV*/
  .box{border-radius:10px; padding:10px 13px; display:flex; flex-direction:column; gap:2px; line-height:1.5}
  .box .k{font-size:12px; font-weight:700}
  .box .v{font-size:15px; font-weight:700; overflow-wrap:anywhere; white-space:pre-line}   /* 換行照顯示（跳行） */
  .box.notice{background:var(--warn-soft)} .box.notice .k,.box.notice .v{color:var(--warn)}
  /* 公告框裡的公告照片、各區位置表格（v11.17.0） */
  /* 公告照片跟藥品照片同一個尺寸（v11.17.2）：表格在左、照片在右 */
  .nrow{display:flex; gap:12px; align-items:flex-start; margin-top:6px}
  .nrow .zones{flex:1; margin-top:0}
  .nrow .sp{flex:1}
  .box.notice .npic{display:block; flex:0 0 auto; width:min(170px,36%); aspect-ratio:4/3; object-fit:contain; background:#fff; border-radius:10px; border:1px solid var(--line); cursor:zoom-in}
  .zones{border-collapse:collapse; font-size:14px; width:100%; max-width:320px}
  .zones caption{text-align:left; font-size:11.5px; color:var(--warn); opacity:.8; padding-bottom:2px}
  .zones th{text-align:left; font-weight:500; color:var(--warn); opacity:.85; padding:3px 10px 3px 0; white-space:nowrap; width:5.5em; border-bottom:1px solid rgba(178,106,0,.18)}
  .zones td{font-weight:700; color:var(--warn); padding:3px 0; border-bottom:1px solid rgba(178,106,0,.18); white-space:pre-line}
  .zones tr:last-child th,.zones tr:last-child td{border-bottom:0}
  .box.feat{background:var(--leaf-soft)} .box.feat .k,.box.feat .v{color:var(--leaf)}
  .box.pair{background:var(--danger-soft)} .box.pair .k,.box.pair .v{color:var(--danger)}
  .kv{display:flex; flex-direction:column; gap:1px}
  .kv .k{font-size:12px; color:var(--muted)} .kv .v{font-size:15px; color:var(--ink2); white-space:pre-line}
  .grid2{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start}
  @media (max-width:420px){ .grid2{grid-template-columns:1fr} .photo{max-width:100%; justify-self:stretch; aspect-ratio:16/10} }
  .photo{width:100%; max-width:220px; aspect-ratio:4/3; object-fit:cover; border-radius:10px; border:1px solid var(--line);
    background:var(--sunk); cursor:zoom-in; justify-self:end}
  .locrow{display:flex; gap:12px; align-items:stretch}
  .loc{flex:0 0 auto; display:flex; align-items:center; gap:8px; background:var(--danger-soft); border-radius:12px;
    padding:12px 16px; min-width:110px}
  .loc .pin{font-size:22px; line-height:1; color:var(--pin)}
  .loc .t{font-size:24px; font-weight:800; color:var(--pin); line-height:1.1; overflow-wrap:anywhere}
  .loc.long .t{font-size:18px}
  .map{flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; background:var(--surface);
    aspect-ratio:3/2; object-fit:contain; cursor:zoom-in}
  .spots{display:flex; gap:7px; flex-wrap:wrap}
  .spots button{border:1.5px solid var(--line); background:var(--surface); color:var(--ink2); border-radius:9px;
    padding:6px 12px; font-size:13.5px; font-weight:700}
  .spots button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .actions{display:flex; gap:8px; margin-top:2px}
  .actions button{flex:1; border:1.5px solid var(--line); background:var(--sunk); color:var(--accent); border-radius:10px;
    padding:10px; font-size:14px; font-weight:700}
  .actions button.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .actions button.quiet{color:var(--muted)}
  .actions button:disabled{opacity:.5; cursor:default}

  /*DEV*/
  /* 修改模式（開發者版才有） */
  .edit{display:flex; flex-direction:column; gap:10px; background:var(--sunk); border-radius:12px; padding:13px 13px 12px}
  .edit .t{font-size:13px; font-weight:700; color:var(--accent)}
  .f{display:flex; flex-direction:column; gap:3px}
  .f label{font-size:12px; color:var(--muted)}
  .f label b{color:var(--accent); font-weight:700; margin-right:5px; font-family:"IBM Plex Mono",monospace}
  .f input,.f textarea,.f select{border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:9px; padding:9px 11px; font-size:15px; line-height:1.4; width:100%}
  .f textarea{min-height:64px; resize:vertical}
  .f .was{font-size:11.5px; color:var(--muted)}
  .edit .actions{margin-top:2px}
  .picrow{display:flex; align-items:center; gap:12px}
  .picrow .ph{position:relative; width:66px; height:66px; border-radius:10px; overflow:hidden; background:var(--surface); border:1px solid var(--line); flex:0 0 66px}
  .picrow .ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .picrow .ph .ki{object-fit:contain; padding:11px; opacity:.45}
  .picrow .ph .pi{background:#fff}
  .picrow button{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:10px 13px; font-size:14px; font-weight:700}
  .picrow button:disabled{opacity:.5}
  .picrow.drop{border:1.5px dashed var(--line); border-radius:12px; padding:8px; outline:none}
  .picrow.drop.active{border-color:var(--accent)}
  .picrow.drop.over{border-style:solid; border-color:var(--accent); background:var(--accent-soft)}
  .picrow .dz{display:flex; flex-direction:column; gap:5px; min-width:0}
  .picrow .dz small{font-size:11.5px; color:var(--muted); line-height:1.4}
  .picrow .dzb{display:flex; gap:8px; flex-wrap:wrap}
  .picrow .ph .none{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted)}
  .zgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px 10px}
  .zc{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2)}
  .zc span{flex:0 0 3.2em}
  .zc input{flex:1; min-width:0; padding:7px 9px; font-size:14px}
  /*/DEV*/

  /* 燈箱 */
  .lb{position:fixed; inset:0; z-index:20; background:rgba(8,12,16,.86); display:flex; align-items:center; justify-content:center; padding:20px}
  .lb img{max-width:100%; max-height:100%; border-radius:8px; background:#fff}
  .lb button{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; width:42px; height:42px; border-radius:50%;
    border:0; background:rgba(255,255,255,.92); color:#111; font-size:20px}
  .demo{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--warn-soft); color:var(--warn); font-size:12px;
    text-align:center; padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line)}
</style>
<script src="app.js?v=v11.22.2" defer></script>
</head>
